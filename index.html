
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Beat: Rhythm Path</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #101426;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px 12px;
}

h1 {
  font-size: 32px;
  margin: 8px 0;
  color: #ffe28a;
}

.subtitle {
  color: #bfc7e8;
  margin-bottom: 18px;
}

.panel {
  max-width: 650px;
  margin: auto;
  padding: 18px;
  background: #1b2340;
  border: 1px solid #ffffff25;
  border-radius: 20px;
  box-shadow: 0 12px 35px #0005;
}

.stats {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin-bottom: 14px;
}

.stat {
  flex: 1;
  padding: 10px 4px;
  border-radius: 12px;
  background: #ffffff10;
}

.stat small {
  display: block;
  color: #aeb9df;
  font-size: 12px;
}

.stat strong {
  display: block;
  margin-top: 5px;
  font-size: 22px;
}

select, button {
  border: 0;
  border-radius: 11px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: bold;
}

select {
  background: #fff;
  color: #222;
  margin: 8px;
}

button {
  cursor: pointer;
  background: #ffcf66;
  color: #29233c;
}

button:hover {
  filter: brightness(1.1);
}

#start {
  margin: 10px;
  min-width: 150px;
  font-size: 17px;
}

canvas {
  display: block;
  width: 100%;
  height: 430px;
  margin: 12px auto;
  border-radius: 15px;
  background: #11182e;
  border: 2px solid #ffffff25;
  touch-action: manipulation;
}

#message {
  min-height: 34px;
  font-size: 21px;
  font-weight: bold;
  color: #ffe28a;
}

.instructions {
  color: #bdc5e0;
  font-size: 13px;
  line-height: 1.8;
}

#levelInfo {
  color: #aeb9df;
  margin: 5px;
}

@media(max-width: 450px) {
  h1 { font-size: 25px; }
  .panel { padding: 10px; }
  canvas { height: 390px; }
}
</style>
</head>

<body>

<h1>🎵 School Beat</h1>
<p class="subtitle">RHYTHM PATH · 학교의 리듬을 따라가!</p>

<div class="panel">

  <div class="stats">
    <div class="stat">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>COMBO</small>
      <strong id="combo">0</strong>
    </div>
    <div class="stat">
      <small>TILE</small>
      <strong id="tile">0 / 50</strong>
    </div>
  </div>

  <div>
    <label for="difficulty">난이도 선택</label>
    <br>
    <select id="difficulty">
      <option value="0">1단계 - 연습</option>
      <option value="1">2단계 - 보통</option>
      <option value="2">3단계 - 어려움</option>
      <option value="3">4단계 - 상당히 빠르게</option>
      <option value="4">5단계 - 불가능한</option>
      <option value="5">6단계 - 음속</option>
    </select>
  </div>

  <p id="levelInfo">1단계 · 연습</p>

  <canvas id="game" width="600" height="430"></canvas>

  <div id="message">게임 시작을 눌러 봐!</div>

  <button id="start">▶ 게임 시작</button>

  <p class="instructions">
    공이 다음 타일에 도착할 때 박자를 맞춰 눌러!<br>
    SPACE / 마우스 클릭 / 화면 터치<br>
    PERFECT +100 · GOOD +50 · MISS 게임 종료
  </p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const tileEl = document.getElementById("tile");
const message = document.getElementById("message");
const startButton = document.getElementById("start");
const difficulty = document.getElementById("difficulty");
const levelInfo = document.getElementById("levelInfo");

const levels = [
  { name: "연습", interval: 750, window: 120 },
  { name: "보통", interval: 620, window: 100 },
  { name: "어려움", interval: 500, window: 80 },
  { name: "상당히 빠르게", interval: 360, window: 60 },
  { name: "불가능한", interval: 260, window: 42 },
  { name: "음속", interval: 180, window: 28 }
];

let score = 0;
let combo = 0;
let tile = 0;
let playing = false;
let lastHit = 0;
let currentLevel = levels[0];
let audio = null;
let animation = null;
let path = [];
let particles = [];

const TOTAL = 50;

function makePath() {
  path = [];

  for (let i = 0; i < TOTAL + 1; i++) {
    const x = 65 + (i % 5) * 115;
    const row = Math.floor(i / 5);
    const direction = row % 2 === 0 ? 1 : -1;
    const actualX = direction === 1 ? x : 65 + (4 - (i % 5)) * 115;

    const y = 65 + row * 75 + Math.sin(i * 1.7) * 13;

    path.push({
      x: actualX,
      y: Math.min(390, y)
    });
  }
}

function sound() {
  try {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audio.state === "suspended") audio.resume();

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.connect(gain);
    gain.connect(audio.destination);

    const now = audio.currentTime;
    const type = tile % 4;

    const frequencies = [850, 130, 1100, 220];

    osc.type = type === 1 ? "sine" : "triangle";
    osc.frequency.setValueAtTime(frequencies[type], now);

    if (type === 2) {
      osc.frequency.exponentialRampToValueAtTime(550, now + 0.18);
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

    osc.start(now);
    osc.stop(now + 0.2);
  } catch (e) {
    console.log(e);
  }
}

function updateStats() {
  scoreEl.textContent = score;
  comboEl.textContent = combo;
  tileEl.textContent = tile + " / " + TOTAL;
}

function drawBackground() {
  ctx.fillStyle = "#11182e";
  ctx.fillRect(0, 0, 600, 430);

  ctx.strokeStyle = "#ffffff08";
  ctx.lineWidth = 1;

  for (let x = 0; x < 600; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 430);
    ctx.stroke();
  }

  for (let y = 0; y < 430; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(600, y);
    ctx.stroke();
  }
}

function drawPath() {
  if (!path.length) return;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);

  for (let i = 1; i < path.length; i++) {
    ctx.lineTo(path[i].x, path[i].y);
  }

  ctx.strokeStyle = "#59658a";
  ctx.lineWidth = 9;
  ctx.stroke();

  for (let i = 0; i < path.length; i++) {
    const p = path[i];

    ctx.beginPath();
    ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);

    if (i < tile) {
      ctx.fillStyle = "#70e4c2";
    } else if (i === tile) {
      ctx.fillStyle = "#ffe28a";
    } else {
      ctx.fillStyle = "#66739e";
    }

    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function getBallPosition(now) {
  const a = path[tile];
  const b = path[Math.min(tile + 1, TOTAL)];

  if (!playing || tile >= TOTAL) return a;

  const progress = Math.min(
    1,
    Math.max(0, (now - lastHit) / currentLevel.interval)
  );

  return {
    x: a.x + (b.x - a.x) * progress,
    y: a.y + (b.y - a.y) * progress
  };
}

function drawBall(now) {
  const p = getBallPosition(now);

  ctx.beginPath();
  ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
  ctx.fillStyle = "#ff6d91";
  ctx.shadowColor = "#ff6d91";
  ctx.shadowBlur = 22;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(p.x - 5, p.y - 5, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 25);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

function burst(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.PI * 2 * i / 12;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * 2.5,
      vy: Math.sin(angle) * 2.5,
      life: 25,
      color: "#ffe28a"
    });
  }
}

function draw(now) {
  drawBackground();
  drawPath();
  drawParticles();

  if (tile <= TOTAL) {
    drawBall(now);
  }
}

function hit() {
  if (!playing) return;

  const now = performance.now();
  const elapsed = now - lastHit;
  const difference = Math.abs(elapsed - currentLevel.interval);

  if (difference > currentLevel.window) {
    if (elapsed < currentLevel.interval - currentLevel.window) {
      message.textContent = "TOO EARLY!";
      message.style.color = "#ffad72";
      return;
    }

    gameOver();
    return;
  }

  const p = path[tile + 1];
  const perfectLimit = currentLevel.window * 0.45;

  if (difference <= perfectLimit) {
    score += 100;
    combo++;
    message.textContent = "PERFECT! +100";
    message.style.color = "#ffe28a";
  } else {
    score += 50;
    combo++;
    message.textContent = "GOOD! +50";
    message.style.color = "#8de5ff";
  }

  tile++;
  lastHit = now;

  sound();
  if (p) burst(p.x, p.y);

  updateStats();

  if (tile >= TOTAL) {
    winGame();
  }
}

function gameOver() {
  playing = false;
  cancelAnimationFrame(animation);

  message.textContent = "MISS! 게임 종료 · 점수: " + score;
  message.style.color = "#ff7187";
  startButton.textContent = "↻ 다시 도전";
}

function winGame() {
  playing = false;
  cancelAnimationFrame(animation);

  score += combo * 20;
  updateStats();

  message.textContent = "🎉 CLEAR! 최종 점수: " + score;
  message.style.color = "#ffe28a";
  startButton.textContent = "↻ 다시 플레이";
}

function loop(now) {
  if (!playing) return;

  const elapsed = now - lastHit;

  if (elapsed > currentLevel.interval + currentLevel.window) {
    gameOver();
    draw(now);
    return;
  }

  draw(now);
  animation = requestAnimationFrame(loop);
}

function startGame() {
  cancelAnimationFrame(animation);

  currentLevel = levels[Number(difficulty.value)];

  score = 0;
  combo = 0;
  tile = 0;
  particles = [];

  makePath();
  updateStats();

  lastHit = performance.now();
  playing = true;

  levelInfo.textContent =
    (Number(difficulty.value) + 1) + "단계 · " +
    currentLevel.name + " · " +
    Math.round(60000 / currentLevel.interval) + " BPM";

  message.textContent = "박자를 맞춰!";
  message.style.color = "#ffe28a";

  startButton.textContent = "플레이 중";

  if (audio && audio.state === "suspended") {
    audio.resume();
  }

  draw(lastHit);
  animation = requestAnimationFrame(loop);
}

startButton.addEventListener("click", () => {
  if (!playing) startGame();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    hit();
  }
});

canvas.addEventListener("pointerdown", () => {
  hit();
});

difficulty.addEventListener("change", () => {
  const n = Number(difficulty.value);
  levelInfo.textContent =
    (n + 1) + "단계 · " + levels[n].name;
});

makePath();
draw(0);
</script>

</body>
</html>
