
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMAL ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#17252b;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;background:#17252bee;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:20px
}
h1{font-size:48px;color:#ffcc57;margin:0 0 10px}
#choices{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin:25px}
.choice{
 background:#304650;border:3px solid #718d96;border-radius:15px;
 padding:18px;width:155px;cursor:pointer;color:white;font-size:17px
}
.choice.selected{border-color:#ffcc57;background:#52636a}
.choice span{display:block;font-size:42px;margin-bottom:10px}
button{cursor:pointer}
#start{background:#ffcc57;border:0;border-radius:12px;padding:15px 45px;font-size:20px;font-weight:bold}
#hud{position:fixed;top:15px;left:15px;z-index:2;display:none}
#healthbar{width:220px;height:18px;background:#555;border-radius:10px;overflow:hidden}
#health{height:100%;background:#42df76;width:100%}
#stats{margin-top:7px;text-shadow:1px 1px 3px black}
#help{position:fixed;bottom:15px;left:15px;z-index:2;display:none;
 background:#17252bcc;padding:12px;border-radius:10px;line-height:1.7}
#ult{position:fixed;bottom:20px;right:25px;z-index:2;display:none;
 background:#ffcc57;color:#222;border:0;border-radius:50%;width:95px;height:95px;font-weight:bold;font-size:15px}
#message{position:fixed;top:35%;width:100%;text-align:center;font-size:38px;
 font-weight:bold;text-shadow:2px 3px 4px black;pointer-events:none}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
 font-size:25px;pointer-events:none}
</style>
</head>
<body>

<div id="menu">
 <h1>🐾 ANIMAL ARENA</h1>
 <p>동물들의 3D 전투가 시작된다!</p>
 <div id="choices">
  <button class="choice selected" data-animal="bear">
   <span>🐻</span><b>곰</b><p>HP 150 / DMG 10</p><p>느리지만 강력함</p>
  </button>
  <button class="choice" data-animal="cat">
   <span>🐱</span><b>고양이</b><p>HP 70 / DMG 7</p><p>빠르고 민첩함</p>
  </button>
  <button class="choice" data-animal="dog">
   <span>🐶</span><b>개</b><p>HP 100 / DMG 6</p><p>돌격 공격</p>
  </button>
 </div>
 <button id="start">게임 시작</button>
 <p style="color:#b9c9ce">WASD 이동 · 마우스 조준 · 클릭 공격 · Q 궁극기</p>
</div>

<div id="hud">
 <b id="name">곰</b>
 <div id="healthbar"><div id="health"></div></div>
 <div id="stats"></div>
</div>
<div id="help">
 WASD : 이동<br>
 마우스 : 시점 조작<br>
 왼쪽 클릭 : 공격<br>
 Q : 궁극기<br>
 ESC : 마우스 잠금 해제
</div>
<button id="ult">궁극기<br>Q</button>
<div id="crosshair">+</div>
<div id="message"></div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9df);
scene.fog = new THREE.Fog(0x91c9df,35,75);

const camera = new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,150
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536b42,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.8});
const floor=new THREE.Mesh(
 new THREE.BoxGeometry(60,1,60),mat(0x63a75a)
);
floor.position.y=-.5;
floor.receiveShadow=true;
scene.add(floor);

// 경기장 벽
const wallMat=mat(0x557b81);
for(let i=0;i<4;i++){
 const wall=new THREE.Mesh(new THREE.BoxGeometry(
  i<2?60:1,4,i<2?1:60
 ),wallMat);
 wall.position.set(
  i===2?-30:i===3?30:0,
  1.5,
  i===0?-30:i===1?30:0
 );
 scene.add(wall);
}

// 장애물
for(let i=0;i<13;i++){
 const x=(Math.random()-.5)*42;
 const z=(Math.random()-.5)*42;
 const rock=new THREE.Mesh(
  new THREE.BoxGeometry(2+Math.random()*2,2,2+Math.random()*2),
  mat(0x927b55)
 );
 rock.position.set(x,1,z);
 rock.castShadow=true;
 scene.add(rock);
}

const data={
 bear:{name:'곰',hp:150,damage:10,range:2,speed:3,color:0x98613c},
 cat:{name:'고양이',hp:70,damage:7,range:6,speed:20,color:0xe6a6a0},
 dog:{name:'개',hp:100,damage:6,range:9,speed:15,color:0xd9b36e}
};

function animal(type){
 const g=new THREE.Group();
 const d=data[type];
 const body=new THREE.Mesh(
  new THREE.SphereGeometry(.65,20,16),mat(d.color)
 );
 body.position.y=1;
 body.scale.set(.9,1.1,.8);
 body.castShadow=true;
 g.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.48,20,16),mat(d.color)
 );
 head.position.set(0,1.85,.15);
 head.castShadow=true;
 g.add(head);

 const dark=mat(0x302321);
 const eyeMat=mat(0xffffff);
 for(const x of [-.19,.19]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.065,12,12),eyeMat);
  eye.position.set(x,1.95,.55);g.add(eye);
 }
 const nose=new THREE.Mesh(
  new THREE.SphereGeometry(.09,12,12),dark
 );
 nose.position.set(0,1.75,.61);g.add(nose);

 if(type==='bear'||type==='cat'){
  for(const x of [-.32,.32]){
   const ear=new THREE.Mesh(
    new THREE.SphereGeometry(.2,12,12),mat(d.color)
   );
   ear.position.set(x,2.22,.12);g.add(ear);
  }
 }
 if(type==='dog'){
  for(const x of [-.36,.36]){
   const ear=new THREE.Mesh(
    new THREE.SphereGeometry(.18,12,12),mat(0x60452c)
   );
   ear.scale.set(.7,1.5,.7);
   ear.position.set(x,2.08,.1);g.add(ear);
  }
 }

 for(const x of [-.35,.35]){
  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(.14,.15,.65,12),mat(d.color)
  );
  leg.position.set(x,.35,.1);g.add(leg);
 }
 return g;
}

let player,playerType='bear',hp=100,ultReady=true;
let enemies=[],projectiles=[];
let playing=false,gameOver=false;
let yaw=0,pitch=.28;
let keys={};
let lastShot=0,ultUntil=0,slowUntil=0;
let catRevived=false;
let dogDash=0;
let mouseDown=false;

const menu=document.getElementById('menu');
const health=document.getElementById('health');
const stats=document.getElementById('stats');
const message=document.getElementById('message');
const ultButton=document.getElementById('ult');

document.querySelectorAll('.choice').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  playerType=btn.dataset.animal;
 };
});

function spawnEnemy(type,x,z){
 const group=animal(type);
 group.position.set(x,0,z);
 scene.add(group);
 enemies.push({
  group,type,hp:data[type].hp,
  maxHp:data[type].hp,
  attackTime:0
 });
}

function start(){
 menu.style.display='none';
 document.getElementById('hud').style.display='block';
 document.getElementById('help').style.display='block';
 ultButton.style.display='block';

 player=animal(playerType);
 player.position.set(0,0,10);
 scene.add(player);
 hp=data[playerType].hp;
 catRevived=false;
 ultReady=true;
 gameOver=false;
 playing=true;
 yaw=0;
 pitch=.28;

 enemies.forEach(e=>scene.remove(e.group));
 enemies=[];
 for(let i=0;i<5;i++){
  spawnEnemy(
   ['bear','cat','dog'][i%3],
   (Math.random()-.5)*35,
   -10-Math.random()*15
  );
 }
 updateHUD();
 renderer.domElement.requestPointerLock?.();
}
document.getElementById('start').onclick=start;

function updateHUD(){
 health.style.width=Math.max(0,hp/data[playerType].hp*100)+'%';
 document.getElementById('name').textContent=data[playerType].name;
 stats.textContent=`HP ${Math.ceil(hp)} / ${data[playerType].hp}  |  공격력 ${data[playerType].damage}`;
 ultButton.textContent=ultReady?'궁극기\\nQ':'충전 중';
}

function direction(){
 return new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)).normalize();
}

function attack(){
 if(!playing||gameOver)return;
 const now=performance.now();
 if(now-lastShot<450)return;
 lastShot=now;

 const d=data[playerType];
 const dir=direction();

 if(playerType==='dog'){
  dogDash=.35;
  player.position.addScaledVector(dir,1.5);
 }

 if(playerType==='bear'){
  enemies.forEach(e=>{
   if(e.group.position.distanceTo(player.position)<3.1){
    e.hp-=d.damage;
   }
  });
  return;
 }

 const startPos=player.position.clone();
 startPos.y=1.4;
 const bullet=new THREE.Mesh(
  new THREE.SphereGeometry(.17,12,12),
  mat(playerType==='cat'?0xffe5a0:0xffffff)
 );
 bullet.position.copy(startPos);
 scene.add(bullet);
 projectiles.push({
  mesh:bullet,
  velocity:dir.multiplyScalar(25),
  damage:d.damage,
  life:Math.min(d.range/25,1)
 });
}

function ultimate(){
 if(!playing||gameOver||!ultReady)return;
 ultReady=false;
 const now=performance.now();

 if(playerType==='bear'){
  slowUntil=now+3500;
  enemies.forEach(e=>{
   if(e.group.position.distanceTo(player.position)<12){
    e.group.userData.slow=now+3500;
   }
  });
  message.textContent='🐻 땅 구르기!';
  setTimeout(()=>message.textContent='',1000);
 }

 if(playerType==='cat'){
  // 다음 부활을 위한 목숨 예약
  catRevived=false;
  message.textContent='🐱 두 개의 목숨!';
  setTimeout(()=>message.textContent='',1000);
 }

 if(playerType==='dog'){
  ultUntil=now+5000;
  message.textContent='🐶 광견 모드!';
  setTimeout(()=>message.textContent='',1000);
 }
 if(playerType!=='dog'){
  setTimeout(()=>{ultReady=true;updateHUD()},10000);
 }else{
  setTimeout(()=>{ultReady=true;updateHUD()},12000);
 }
 updateHUD();
}
ultButton.onclick=ultimate;

function playerHit(amount){
 hp-=amount;
 if(hp<=0){
  if(playerType==='cat'&&!catRevived){
   catRevived=true;
   hp=data.cat.hp;
   player.position.set(0,0,10);
   message.textContent='🐱 다시 부활!';
   setTimeout(()=>message.textContent='',1200);
  }else{
   hp=0;
   playing=false;
   gameOver=true;
   message.textContent='GAME OVER';
   setTimeout(()=>{
    menu.style.display='flex';
    document.getElementById('hud').style.display='none';
    document.getElementById('help').style.display='none';
    ultButton.style.display='none';
    message.textContent='';
   },2000);
  }
 }
 updateHUD();
}

function removeDead(){
 enemies=enemies.filter(e=>{
  if(e.hp<=0){
   scene.remove(e.group);
   return false;
  }
  return true;
 });
}

function update(dt){
 if(!playing||!player)return;

 const d=data[playerType];
 const now=performance.now();
 const forward=direction();
 const right=new THREE.Vector3(-forward.z,0,forward.x);
 let move=new THREE.Vector3();

 if(keys.KeyW)move.add(forward);
 if(keys.KeyS)move.sub(forward);
 if(keys.KeyD)move.add(right);
 if(keys.KeyA)move.sub(right);
 if(move.length()>0)move.normalize();

 let speed=d.speed*.28;
 if(playerType==='dog'&&now<ultUntil)speed+=.4;
 if(playerType==='dog'&&dogDash>0){
  move.add(forward.clone().multiplyScalar(2));
  dogDash-=dt;
 }
 player.position.addScaledVector(move,speed*dt);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-27,27);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-27,27);

 if(move.length()>0)player.rotation.y=Math.atan2(-move.x,-move.z);

 // 3인칭 카메라
 const behind=direction().multiplyScalar(-8);
 camera.position.lerp(
  new THREE.Vector3(
   player.position.x+behind.x,
   player.position.y+5+pitch*5,
   player.position.z+behind.z
  ),.12
 );
 camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);

 if(mouseDown)attack();

 // 투사체 이동
 projectiles.forEach(p=>{
  p.mesh.position.addScaledVector(p.velocity,dt);
  p.life-=dt;
  enemies.forEach(e=>{
   if(p.mesh.position.distanceTo(
    e.group.position.clone().add(new THREE.Vector3(0,1,0))
   )<1){
    e.hp-=p.damage;
    p.life=0;
   }
  });
 });
 projectiles=projectiles.filter(p=>{
  if(p.life<=0){
   scene.remove(p.mesh);return false;
  }
  return true;
 });

 // 적 AI
 enemies.forEach(e=>{
  const pos=e.group.position;
  const delta=player.position.clone().sub(pos);
  const dist=delta.length();
  const slow=now<(e.group.userData.slow||0);
  if(dist>2){
   delta.y=0;
   delta.normalize();
   pos.addScaledVector(delta,(slow?1.1:2.1)*dt);
   e.group.rotation.y=Math.atan2(-delta.x,-delta.z);
  }
  if(dist<2.7&&now-e.attackTime>1000){
   e.attackTime=now;
   playerHit(5);
  }
 });
 removeDead();

 if(enemies.length===0){
  for(let i=0;i<5;i++)
   spawnEnemy(['bear','cat','dog'][i%3],
    (Math.random()-.5)*35,-15-Math.random()*10);
 }

 updateHUD();
}

document.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='KeyQ')ultimate();
});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousedown',e=>{
 if(e.button===0&&playing)mouseDown=true;
});
document.addEventListener('mouseup',()=>mouseDown=false);

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.003;
  pitch=THREE.MathUtils.clamp(
   pitch-e.movementY*.002,-.3,1.0
  );
 }
});
renderer.domElement.addEventListener('click',()=>{
 if(playing&&document.pointerLockElement!==renderer.domElement)
  renderer.domElement.requestPointerLock();
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 update(dt);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
